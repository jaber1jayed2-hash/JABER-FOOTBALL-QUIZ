
name: Build JABER FOOTBALL QUIZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.jaber.footballquiz .

      - name: Add Internet Permission and Deep Link
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  permission + "    <application",
                  1
              )

          deep_link = '''
                  <intent-filter>
                      <action android:name="android.intent.action.VIEW" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <category android:name="android.intent.category.BROWSABLE" />
                      <data android:scheme="jaberquiz" android:host="login-callback" />
                  </intent-filter>
          '''

          if 'android:scheme="jaberquiz"' not in content:
              activity_start = content.find("<activity")
              activity_end = content.find("</activity>", activity_start)

              if activity_start == -1 or activity_end == -1:
                  raise Exception("MainActivity not found")

              content = (
                  content[:activity_end]
                  + deep_link
                  + "\n        "
                  + content[activity_end:]
              )

          path.write_text(content)
          print("Manifest configured successfully.")
          PY

      - name: Apply Admin App Name to Android Launcher
        run: |
          python3 - <<'PY'
          import json
          import re
          import urllib.request
          from pathlib import Path
          from xml.sax.saxutils import quoteattr

          base = "https://cuvfoltgtopchiugrbuf.supabase.co"
          key = "sb_publishable_9Ap4_wNTgEujxZy8wq4sKg_x1IsQd8D"

          url = (
              base
              + "/rest/v1/app_settings"
              + "?select=value&key=eq.home_app_name"
          )

          req = urllib.request.Request(
              url,
              headers={
                  "apikey": key,
                  "Authorization": "Bearer " + key
              }
          )

          with urllib.request.urlopen(req, timeout=30) as response:
              data = json.loads(response.read().decode())

          app_name = "JABER FOOTBALL QUIZ"

          if data and data[0].get("value"):
              app_name = str(data[0]["value"]).strip()

          if not app_name:
              app_name = "JABER FOOTBALL QUIZ"

          if len(app_name) > 100:
              raise Exception("App name is too long. Maximum 100 characters.")

          manifest = Path("android/app/src/main/AndroidManifest.xml")
          content = manifest.read_text()

          match = re.search(r"<application\b[^>]*>", content, re.DOTALL)

          if not match:
              raise Exception("Android application tag not found.")

          application_tag = match.group(0)

          label_attribute = "android:label=" + quoteattr(app_name)

          if re.search(r'\bandroid:label\s*=\s*"[^"]*"', application_tag):
              application_tag = re.sub(
                  r'\bandroid:label\s*=\s*"[^"]*"',
                  lambda _: label_attribute,
                  application_tag,
                  count=1
              )
          else:
              application_tag = application_tag[:-1] + " " + label_attribute + ">"

          content = (
              content[:match.start()]
              + application_tag
              + content[match.end():]
          )

          manifest.write_text(content)

          print("Android Launcher Name configured successfully.")
          print("App Name:", app_name)
          PY

      - name: Configure Android Release Lint
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/build.gradle.kts")

          if not path.exists():
              path = Path("android/app/build.gradle")

          if not path.exists():
              raise Exception("Android Gradle file not found")

          content = path.read_text()

          if path.name == "build.gradle.kts":
              lint_config = """
          android {
              lint {
                  checkReleaseBuilds = false
              }
          }
          """
          else:
              lint_config = """
          android {
              lint {
                  checkReleaseBuilds false
              }
          }
          """

          content += "\n" + lint_config
          path.write_text(content)

          print("Release lint checks disabled.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Download Admin App Icon
        run: |
          mkdir -p assets
          python3 - <<'PY'
          import json
          import urllib.request
          from pathlib import Path

          base = "https://cuvfoltgtopchiugrbuf.supabase.co"
          key = "sb_publishable_9Ap4_wNTgEujxZy8wq4sKg_x1IsQd8D"

          req = urllib.request.Request(
              base + "/rest/v1/app_settings?select=value&key=eq.app_icon_url",
              headers={
                  "apikey": key,
                  "Authorization": "Bearer " + key
              }
          )

          with urllib.request.urlopen(req) as response:
              data = json.loads(response.read().decode())

          if not data or not data[0].get("value"):
              raise Exception("Admin App Icon URL not found")

          image_url = data[0]["value"]

          if not image_url.startswith(base + "/storage/v1/object/public/"):
              raise Exception("Invalid App Icon URL")

          urllib.request.urlretrieve(image_url, "assets/app_icon.png")

          if Path("assets/app_icon.png").stat().st_size == 0:
              raise Exception("Downloaded icon is empty")

          print("Admin App Icon downloaded successfully")
          PY

      - name: Generate Android App Icon
        run: |
          cat > flutter_launcher_icons.yaml <<'EOF'
          flutter_launcher_icons:
            android: true
            ios: false
            image_path: "assets/app_icon.png"
            adaptive_icon_background: "#090D0B"
            adaptive_icon_foreground: "assets/app_icon.png"
          EOF
          dart run flutter_launcher_icons

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JABER-FOOTBALL-QUIZ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
