
name: Build JABER FOOTBALL QUIZ APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Create Android project files
        run: flutter create --platforms=android --org com.jaber.footballquiz .

      - name: Add Internet Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          content = path.read_text()

          permission = '    <uses-permission android:name="android.permission.INTERNET" />\n'

          if "android.permission.INTERNET" not in content:
              content = content.replace(
                  "<application",
                  permission + "    <application",
                  1
              )

          path.write_text(content)
          print("Internet Permission added successfully.")
          PY

      - name: Install dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: JABER-FOOTBALL-QUIZ-APK
          path: build/app/outputs/flutter-apk/app-release.apk
