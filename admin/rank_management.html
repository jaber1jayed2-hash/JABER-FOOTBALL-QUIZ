<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rank Management</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080d0b;color:white;font-family:Arial,sans-serif}header{background:#101b15;padding:18px;border-bottom:2px solid #16c766}h2{color:#20e879}main{max-width:1100px;margin:auto;padding:15px}.card{background:#14221a;border:1px solid #244a32;border-radius:12px;padding:16px;margin:15px 0}button{width:100%;padding:12px;margin:8px 0;border:0;border-radius:7px;background:#16c766;color:#06130a;font-weight:bold}button.secondary{background:#294b35;color:white}button.danger{background:#a83232;color:white}input{width:100%;padding:12px;margin:8px 0;border-radius:7px;border:0;background:#e8eee9;color:#111}label{display:block;margin-top:12px;font-weight:bold}small,.status{color:#b7c8bd;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.item{background:#1a3022;padding:12px;border-radius:10px;border:1px solid #315b3d}img{width:100%;height:140px;object-fit:contain;background:#0b140e;border-radius:8px;margin:8px 0}.preview{max-width:220px;height:auto}.hidden{display:none!important}</style></head><body><header><h2>⚽ JABER FOOTBALL QUIZ</h2><p>RANK MANAGEMENT</p></header><main><div class="card"><button class="secondary" onclick="location.href='index.html'">← Admin Dashboard-এ ফিরে যান</button><p id="authStatus" class="status">Admin Session যাচাই হচ্ছে...</p></div><div id="work" class="card hidden"><h2>🏆 Rank Management</h2><p class="status">২২টি Rank-এর emblem আপলোড, পরিবর্তন ও সরানো যাবে।</p><div id="rankGrid" class="grid">লোড হচ্ছে...</div><p id="rankStatus" class="status"></p></div></main><script>const SUPABASE_URL="https://cuvfoltgtopchiugrbuf.supabase.co";const KEY="sb_publishable_9Ap4_wNTgEujxZy8wq4sKg_x1IsQd8D";const db=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let ok=false;async function guard(){try{const {data,error}=await db.auth.getSession();if(error)throw error;if(!data.session)throw new Error('Login Session পাওয়া যায়নি। Dashboard-এ Login করুন।');const {data:a,error:e}=await db.from('admin_users').select('user_id').eq('user_id',data.session.user.id).maybeSingle();if(e)throw e;if(!a)throw new Error('Admin অনুমতি নেই।');ok=true;$('authStatus').textContent='Admin verified';$('work').classList.remove('hidden');await init();}catch(e){$('authStatus').textContent=e.message;}}async function saveSetting(key,value){const {error}=await db.from('app_settings').upsert({key,value:String(value),updated_at:new Date().toISOString()},{onConflict:'key'});if(error)throw error;}function validFile(f){if(!f)return 'ছবি নির্বাচন করুন';if(!f.type.startsWith('image/'))return 'শুধু ছবি';if(f.size>10*1024*1024)return '১০ MB-এর বেশি নয়';return '';}guard();async function init(){await loadRanks()}async function loadRanks(){try{const {data,error}=await db.from('quiz_ranks').select('id,rank_name,min_xp,image_url,sort_order').order('sort_order',{ascending:true});if(error)throw error;const g=$('rankGrid');g.innerHTML='';(data||[]).forEach(r=>{const c=document.createElement('div');c.className='item';const im=document.createElement('img');im.alt=r.rank_name;if(r.image_url)im.src=r.image_url;const t=document.createElement('strong');t.textContent=r.rank_name;const xp=document.createElement('small');xp.textContent='Minimum XP: '+r.min_xp;const f=document.createElement('input');f.type='file';f.accept='image/*';const b=document.createElement('button');b.textContent='Upload / Replace';b.onclick=async()=>{const file=f.files[0];const v=validFile(file);if(v)return alert(v);b.disabled=true;$('rankStatus').textContent=r.rank_name+' আপলোড হচ্ছে...';try{const ext=(file.name.split('.').pop()||'png').replace(/[^a-z0-9]/gi,'');const path='rank-'+r.id+'-'+Date.now()+'.'+ext;const {error:up}=await db.storage.from('quiz-rank-images').upload(path,file,{upsert:true,contentType:file.type});if(up)throw up;const {data:u}=db.storage.from('quiz-rank-images').getPublicUrl(path);const {error:save}=await db.from('quiz_ranks').update({image_url:u.publicUrl}).eq('id',r.id);if(save)throw save;im.src=u.publicUrl;r.image_url=u.publicUrl;$('rankStatus').textContent='ছবি সংরক্ষিত হয়েছে।';}catch(e){$('rankStatus').textContent='Error: '+e.message;}finally{b.disabled=false;}};const rm=document.createElement('button');rm.className='danger';rm.textContent='ছবি সরান';rm.onclick=async()=>{if(!r.image_url)return alert('ছবি নেই');if(!confirm(r.rank_name+'-এর ছবি সরাবেন?'))return;rm.disabled=true;try{const {error}=await db.from('quiz_ranks').update({image_url:null}).eq('id',r.id);if(error)throw error;im.removeAttribute('src');r.image_url=null;$('rankStatus').textContent='Rank image URL সরানো হয়েছে।';}catch(e){$('rankStatus').textContent='Error: '+e.message;}finally{rm.disabled=false;}};c.append(im,t,xp,f,b,rm);g.append(c);});$('rankStatus').textContent='মোট '+(data||[]).length+'টি Rank';}catch(e){$('rankStatus').textContent='Load Error: '+e.message;}}</script></body></html>
