<!DOCTYPE html><html lang="bn"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Loading Screen Design</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>*{box-sizing:border-box}body{margin:0;background:#080d0b;color:white;font-family:Arial,sans-serif}header{background:#101b15;padding:18px;border-bottom:2px solid #16c766}h2{color:#20e879}main{max-width:1100px;margin:auto;padding:15px}.card{background:#14221a;border:1px solid #244a32;border-radius:12px;padding:16px;margin:15px 0}button{width:100%;padding:12px;margin:8px 0;border:0;border-radius:7px;background:#16c766;color:#06130a;font-weight:bold}button.secondary{background:#294b35;color:white}button.danger{background:#a83232;color:white}input{width:100%;padding:12px;margin:8px 0;border-radius:7px;border:0;background:#e8eee9;color:#111}label{display:block;margin-top:12px;font-weight:bold}small,.status{color:#b7c8bd;white-space:pre-wrap;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}.item{background:#1a3022;padding:12px;border-radius:10px;border:1px solid #315b3d}img{width:100%;height:140px;object-fit:contain;background:#0b140e;border-radius:8px;margin:8px 0}.preview{max-width:220px;height:auto}.hidden{display:none!important}</style></head><body><header><h2>⚽ JABER FOOTBALL QUIZ</h2><p>LOADING SCREEN DESIGN</p></header><main><div class="card"><button class="secondary" onclick="location.href='index.html'">← Admin Dashboard-এ ফিরে যান</button><p id="authStatus" class="status">Admin Session যাচাই হচ্ছে...</p></div><div id="work" class="card hidden"><h2>🖼️ Loading Screen Design</h2><p class="status">দুটি Loading image নির্বাচন করে আলাদাভাবে সংরক্ষণ করুন।</p><label>Loading Image 1</label><input id="file1" type="file" accept="image/*"><img id="preview1" class="preview hidden"><label>Loading Image 2</label><input id="file2" type="file" accept="image/*"><img id="preview2" class="preview hidden"><button id="save">দুটি ছবি সংরক্ষণ করুন</button><p id="saveStatus" class="status"></p></div></main><script>const SUPABASE_URL="https://cuvfoltgtopchiugrbuf.supabase.co";const KEY="sb_publishable_9Ap4_wNTgEujxZy8wq4sKg_x1IsQd8D";const db=window.supabase.createClient(SUPABASE_URL,KEY,{auth:{persistSession:true,autoRefreshToken:true}});const $=id=>document.getElementById(id);let ok=false;async function guard(){try{const {data,error}=await db.auth.getSession();if(error)throw error;if(!data.session)throw new Error('Login Session পাওয়া যায়নি। Dashboard-এ Login করুন।');const {data:a,error:e}=await db.from('admin_users').select('user_id').eq('user_id',data.session.user.id).maybeSingle();if(e)throw e;if(!a)throw new Error('Admin অনুমতি নেই।');ok=true;$('authStatus').textContent='Admin verified';$('work').classList.remove('hidden');await init();}catch(e){$('authStatus').textContent=e.message;}}async function saveSetting(key,value){const {error}=await db.from('app_settings').upsert({key,value:String(value),updated_at:new Date().toISOString()},{onConflict:'key'});if(error)throw error;}function validFile(f){if(!f)return 'ছবি নির্বাচন করুন';if(!f.type.startsWith('image/'))return 'শুধু ছবি';if(f.size>10*1024*1024)return '১০ MB-এর বেশি নয়';return '';}guard();let urls={};async function init(){const {data,error}=await db.from('app_settings').select('key,value').in('key',['loading_image_1_url','loading_image_2_url']);if(error){$('saveStatus').textContent=error.message;return}(data||[]).forEach(x=>urls[x.key]=x.value);showPreview('preview1',urls.loading_image_1_url);showPreview('preview2',urls.loading_image_2_url);['file1','file2'].forEach((id,i)=>$(id).addEventListener('change',()=>{const f=$(id).files[0];if(!f){showPreview('preview'+(i+1),urls['loading_image_'+(i+1)+'_url']);return}const v=validFile(f);if(v){alert(v);$(id).value='';return}showPreview('preview'+(i+1),URL.createObjectURL(f));}));function showPreview(id,url){const im=$(id);if(url){im.src=url;im.classList.remove('hidden')}else{im.removeAttribute('src');im.classList.add('hidden')}}$('save').addEventListener('click',async()=>{if(!ok)return;$('save').disabled=true;$('saveStatus').textContent='সংরক্ষণ হচ্ছে...';try{for(let i=1;i<=2;i++){const f=$('file'+i).files[0];if(!f)continue;const ext=(f.name.split('.').pop()||'png').replace(/[^a-z0-9]/gi,'');const path='loading-screen-'+i+'-'+Date.now()+'.'+ext;const {error}=await db.storage.from('app-assets').upload(path,f,{upsert:false,contentType:f.type});if(error)throw error;const {data}=db.storage.from('app-assets').getPublicUrl(path);await saveSetting('loading_image_'+i+'_url',data.publicUrl);urls['loading_image_'+i+'_url']=data.publicUrl;showPreview('preview'+i,data.publicUrl);$('file'+i).value='';} $('saveStatus').textContent='নির্বাচিত ছবিগুলো সংরক্ষণ হয়েছে।';}catch(e){$('saveStatus').textContent='Error: '+e.message;}finally{$('save').disabled=false;}});</script></body></html>
